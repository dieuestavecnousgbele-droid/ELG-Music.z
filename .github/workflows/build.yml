name: Build ELG Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check generator scripts
        run: |
          for f in setup_elg_full.sh setup_elg_v16_module3.sh; do
            if [ ! -f "$f" ]; then echo "ERREUR : $f est absent de la racine du depot"; exit 1; fi
            sed -i 's/\r$//' "$f"
          done

      - name: Generate ELG Music project files
        run: bash setup_elg_full.sh

      - name: Apply v1.6 Module 3 (Settings)
        run: bash setup_elg_v16_module3.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: elg-music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
bug/*.apk
